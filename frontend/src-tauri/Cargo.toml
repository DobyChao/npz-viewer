[package]
name = "npz-view"
version = "0.1.0"
description = "npz 浏览器 desktop client (Tauri + Node hub)"
authors = ["npz-view"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "npz_view_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
